[package]
name = "dsh-native-client"
version = "0.1.0"
description = "Windows 原生桌面客户端：DeepSeek Harness Web GUI 的桌面外壳"
authors = ["dsh"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dsh_native_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol：release 构建必须启用（否则应用按 dev 模式运行，webview 直接加载 devUrl 而非内嵌启动页）
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
