name: Build Desktop Apps

# 触发方式：
#  - 推送 v* 标签 → 构建、签名更新产物并发布 Release（含 updater 的 latest.json）
#  - 手动触发：Actions 页面 → Build Desktop Apps → Run workflow（仅构建上传产物，不发布）
#
# 必需 secret：
#   - TAURI_SIGNING_PRIVATE_KEY          更新包签名私钥（tauri signer generate 生成的内容）
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD 上述私钥的密码（生成时用 --password 设置）
# 两者与 src-tauri/tauri.conf.json 里的 updater.pubkey 配对；缺失则无法签名、release job 会失败
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-arm64
    env:
      # 更新包签名私钥（tauri build 时对 .sig 生成必需）
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      # 私钥密码（tauri signer generate --password 生成时设置）
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies (tauri CLI)
        run: npm ci

      - name: Bundle DeepSeek Harness backend (Node runtime + official dsh)
        run: node scripts/bundle-backend.mjs

      - name: Cache cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Windows 收窄为 NSIS：不构建 MSI（减小构建耗时与发布物体积；在线更新与手动安装均用 NSIS）
      - name: Build ${{ matrix.label }} (Windows, NSIS only)
        if: matrix.os == 'windows-latest'
        run: npm run build -- --target ${{ matrix.target }} --bundles nsis

      - name: Build ${{ matrix.label }} (macOS)
        if: matrix.os == 'macos-14'
        run: npm run build -- --target ${{ matrix.target }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: deeprein-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error

  release:
    name: Publish release (updater)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Read app version
        id: version
        run: |
          echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Generate updater latest.json
        run: |
          node scripts/make-latest-json.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --tag "${{ github.ref_name }}" \
            --notes "deeprein ${{ github.ref_name }}：${{ github.event.head_commit.message }}" \
            --scan artifacts \
            --out latest.json

      - name: Create GitHub Release (with update packages)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: deeprein ${{ github.ref_name }}
          body: 自动发布：deeprein ${{ github.ref_name }}（含在线更新包与 latest.json）
          files: |
            latest.json
            artifacts/**/*
          fail_on_unmatched_files: true
